name: Links

# Markdown の中の外部のサイトへのリンク（https://...）が切れていないかを、週 1 回確かめる（lychee。設定は lychee.toml）。
# 外部のサイトは相手の都合で一時的に失敗することがあるため、PR の CI では確かめず、ここで確かめて Issue で知らせる。
# ファイルと見出しへのリンクは、ci.yml の links で PR ごとに確かめている
on:
  schedule:
    # 毎週月曜 9:17（日本時間。UTC では 0:17）
    - cron: '17 0 * * 1'
  workflow_dispatch:

jobs:
  external-links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
    - uses: actions/checkout@v6

    - name: Check external links
      id: lychee
      uses: lycheeverse/lychee-action@v2.9.0
      with:
        lycheeVersion: v0.24.2
        args: --include-fragments --no-progress --config lychee.toml './**/*.md'
        output: lychee/out.md
        fail: false

    # リンク切れ（lychee の終了コード 2）があれば、ラベル link-check の Issue を作る（開いている Issue があれば、コメントで結果を足す）
    - name: Report broken links
      if: steps.lychee.outputs.exit_code == 2
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        { echo "外部のサイトへのリンクの確認（[実行結果]($RUN_URL)）で、切れているリンクが見つかりました。"; echo; cat lychee/out.md; } > report.md
        gh label create link-check --description "リンク切れ（Links ワークフロー）" --color d73a4a --force
        issue=$(gh issue list --label link-check --state open --json number --jq '.[0].number')
        if [ -n "$issue" ]; then
          gh issue comment "$issue" --body-file report.md
        else
          gh issue create --title "リンク切れ: 外部のサイトへのリンク" --label link-check --body-file report.md
        fi

    # lychee 自体が失敗した場合（入力が無い: 1、設定の誤り: 3）は、ワークフローを失敗させる
    - name: Fail on lychee error
      if: steps.lychee.outputs.exit_code != 0 && steps.lychee.outputs.exit_code != 2
      run: exit 1
