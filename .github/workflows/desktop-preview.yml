name: Desktop Preview
# 実行の一覧で、どの版の評価版かが分かるようにする
run-name: Desktop Preview ${{ inputs.version || format('0.1.{0}', github.run_number) }}

# デスクトップアプリを Store を通さずに評価者へ渡すための、自己署名の証明書で署名した MSIX（x64・arm64）を作る
# （docs/design/desktop/desktop-preview.md、REVIEW_ISSUES No.65）。成果物は Actions の実行結果の Artifacts から取り出し、評価者に渡す。
# 評価者の導入の手順は docs/DESKTOP_PREVIEW_INSTALL.md（成果物にも INSTALL.md として入れる）。Azure は使わない
on:
  workflow_dispatch:
    inputs:
      version:
        description: "パッケージの版 X.Y.Z（空なら 0.1.<実行番号>。評価者が上書きで更新できるよう、前の配布より大きくする）"
        required: false
        default: ""
  # workflow_dispatch は既定のブランチにあるワークフローしか実行できないため、作業ブランチでは、最後のコミットのメッセージに
  # [preview] を入れて push したときに作る（入っていなければ、ジョブは実行せずに飛ばす）
  push:

concurrency:
  group: desktop-preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  desktop-preview:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[preview]')
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PREVIEW_VERSION: ${{ inputs.version || format('0.1.{0}', github.run_number) }}

    steps:
    # 後の手順で git の資格情報を使わないため、保存しない
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # 署名の証明書。リポジトリのシークレット DESKTOP_PREVIEW_PFX（PFX の Base64）と DESKTOP_PREVIEW_PFX_PASSWORD があれば、それを使う
    # （評価者は証明書を一度信頼すれば、以後の配布をそのまま導入できる）。無ければこの実行だけの証明書を作る（配布のたびに .cer を信頼し直す必要がある）。
    # 発行元はマニフェストの Publisher（CN=TTDeployTool）と同じでないと署名できない
    - name: Prepare the signing certificate
      id: cert
      shell: pwsh
      env:
        PFX_BASE64: ${{ secrets.DESKTOP_PREVIEW_PFX }}
        PFX_PASSWORD: ${{ secrets.DESKTOP_PREVIEW_PFX_PASSWORD }}
      run: |
        if ($env:PFX_BASE64) {
          $pfx = Join-Path $env:RUNNER_TEMP "preview.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $password = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -Password $password -CertStoreLocation "Cert:\CurrentUser\My"
          Remove-Item $pfx
          if ($cert.Subject -ne "CN=TTDeployTool") { throw "証明書の発行先が $($cert.Subject) です（期待: CN=TTDeployTool）。" }
          if ($cert.NotAfter -lt (Get-Date).AddDays(30)) { throw "証明書の期限（$($cert.NotAfter)）が 30 日以内です。docs/design/desktop/desktop-preview.md の 3 で作り直してください。" }
          Write-Host "シークレットの証明書で署名します（期限: $($cert.NotAfter.ToString('yyyy-MM-dd'))）。"
        } else {
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=TTDeployTool" -KeyUsage DigitalSignature `
            -FriendlyName "TTDeployTool preview (run ${{ github.run_id }})" -CertStoreLocation "Cert:\CurrentUser\My" `
            -NotAfter (Get-Date).AddDays(90) -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          Write-Host "::warning::シークレット DESKTOP_PREVIEW_PFX が無いため、この実行だけの証明書で署名しました。評価者は今回の TTDeployTool-preview.cer を信頼し直す必要があります（docs/design/desktop/desktop-preview.md の 3）。"
        }
        New-Item -ItemType Directory -Force -Path Preview | Out-Null
        Export-Certificate -Cert $cert -FilePath Preview\TTDeployTool-preview.cer | Out-Null
        "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

    # 版だけを変える（ID はマニフェストの仮の値のまま。Store の版とは発行元が違うため、別のアプリとして並べて入る）
    - name: Set package version
      shell: pwsh
      run: ./.github/scripts/set-msix-identity.ps1 -Manifest src/TTDeployTool.Controller.Desktop/Package.appxmanifest -Tag "v$env:PREVIEW_VERSION"

    - name: Build and sign MSIX (x64 and arm64)
      shell: pwsh
      run: |
        foreach ($platform in "x64", "arm64") {
          msbuild src/TTDeployTool.Controller.Desktop/TTDeployTool.Controller.Desktop.csproj /restore `
            /p:Configuration=Release /p:Platform=$platform /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:GenerateAppxPackageOnBuild=true /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateThumbprint=${{ steps.cert.outputs.thumbprint }} `
            /p:AppxPackageDir=${{ github.workspace }}\PreviewBuild\$platform\ `
            /p:DesktopClientId=${{ vars.TT_DESKTOP_CLIENT_ID }}
          if ($LASTEXITCODE -ne 0) { throw "$platform のビルドに失敗しました。" }
        }

    # 評価者に渡す形に並べる: <アーキテクチャ>\TTDeployTool-<版>-<アーキテクチャ>.msix（と、あれば Dependencies）・.cer・INSTALL.md
    - name: Collect the packages
      shell: pwsh
      run: |
        foreach ($platform in "x64", "arm64") {
          $all = @(Get-ChildItem "PreviewBuild\$platform" -Recurse -Filter *.msix)
          $packages = @($all | Where-Object { $_.FullName -notmatch '\\Dependencies\\' })
          if ($packages.Count -ne 1) { throw "$platform の MSIX が 1 つではありません（$($packages.Count) 個）。" }
          $target = New-Item -ItemType Directory -Force -Path "Preview\$platform"
          Copy-Item $packages[0].FullName (Join-Path $target "TTDeployTool-$env:PREVIEW_VERSION-$platform.msix")
          $dependencies = @($all | Where-Object { $_.FullName -match "\\Dependencies\\$platform\\" })
          if ($dependencies.Count -gt 0) {
            $dir = New-Item -ItemType Directory -Force -Path (Join-Path $target "Dependencies")
            $dependencies | Copy-Item -Destination $dir
          }
        }
        Copy-Item docs/DESKTOP_PREVIEW_INSTALL.md Preview\INSTALL.md
        Get-ChildItem Preview -Recurse | Format-Table FullName, Length

    # 評価者と同じ手順（.cer を信頼する → MSIX を導入する）で、x64 の MSIX が導入でき、版と署名が合っていることを確かめる
    - name: Verify the x64 package installs
      shell: pwsh
      run: |
        Import-Certificate -FilePath Preview\TTDeployTool-preview.cer -CertStoreLocation "Cert:\LocalMachine\TrustedPeople" | Out-Null
        $package = Get-Item "Preview\x64\TTDeployTool-$env:PREVIEW_VERSION-x64.msix"
        $dependencies = @(Get-ChildItem Preview\x64\Dependencies -Filter *.msix -ErrorAction SilentlyContinue | ForEach-Object FullName)
        if ($dependencies.Count -gt 0) {
          Add-AppxPackage -Path $package.FullName -DependencyPath $dependencies
        } else {
          Add-AppxPackage -Path $package.FullName
        }
        $installed = Get-AppxPackage -Name TTDeployTool
        if ($installed.Version -ne "$env:PREVIEW_VERSION.0") { throw "導入した版が $($installed.Version) です（期待: $env:PREVIEW_VERSION.0）。" }
        Write-Host "導入できました: $($installed.PackageFullName)"
        Remove-AppxPackage -Package $installed.PackageFullName

    # パッケージは 2 つで約 200MB あるため、30 日で消す（評価者に渡したら不要）
    - name: Upload the preview packages
      uses: actions/upload-artifact@v7
      with:
        name: ttdeploytool-desktop-preview-${{ env.PREVIEW_VERSION }}
        path: Preview
        retention-days: 30

    - name: Remove the signing certificate
      if: always()
      shell: pwsh
      run: |
        if ("${{ steps.cert.outputs.thumbprint }}") {
          Remove-Item "Cert:\CurrentUser\My\${{ steps.cert.outputs.thumbprint }}" -ErrorAction SilentlyContinue
        }
