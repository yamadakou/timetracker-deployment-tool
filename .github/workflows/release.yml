name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    # EXE とイメージの版（MCP サーバーが serverInfo で報告する）。タグ v1.2.3 → 1.2.3
    # （VERSION という名前にしないこと。MSBuild が環境変数をプロパティとして読み、Version=v1.2.3 になって復元が失敗する）
    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
    - uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Test
      run: dotnet test TTDeployTool.sln --configuration Release

    # README 記載と同じ単一ファイル・self-contained の EXE を生成（.NET ランタイム不要）
    - name: Publish
      run: dotnet publish src/TTDeployTool.Controller.Cli/TTDeployTool.Controller.Cli.csproj --configuration Release -r win-x64 -p:PublishSingleFile=true -p:SelfContained=true -p:UseAppHost=true -p:DebugType=None -p:Version=$($env:RELEASE_TAG.TrimStart("v")) --output publish

    # MCP サーバー（stdio）も CLI と同じ形式の単一ファイル EXE にする（MCP クライアントの設定で command に指定する）
    - name: Publish MCP server
      run: dotnet publish src/TTDeployTool.Controller.Mcp/TTDeployTool.Controller.Mcp.csproj --configuration Release -r win-x64 -p:PublishSingleFile=true -p:SelfContained=true -p:UseAppHost=true -p:DebugType=None -p:Version=$($env:RELEASE_TAG.TrimStart("v")) --output publish-mcp

    - name: Zip artifacts
      run: |
        Compress-Archive -Path publish\* -DestinationPath ttdeploytool-cli-${{ github.ref_name }}.zip
        Compress-Archive -Path publish-mcp\* -DestinationPath ttdeploytool-mcp-${{ github.ref_name }}.zip

    - name: Create GitHub Release
      run: gh release create ${{ github.ref_name }} ttdeploytool-cli-${{ github.ref_name }}.zip ttdeploytool-mcp-${{ github.ref_name }}.zip --title "${{ github.ref_name }}" --generate-notes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # MCP サーバー（HTTP）のコンテナイメージを GHCR に push する（ghcr.io/<owner>/ttdeploytool-mcp:<バージョン> と latest）。
  # 初回の push の後、GHCR のパッケージの公開設定（public にするか）は手動で行う
  image:
    # テスト（release ジョブ）が成功した場合だけ公開する
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v6

    - name: Log in to GHCR
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

    - name: Build and push
      run: |
        image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ttdeploytool-mcp
        version=${GITHUB_REF_NAME#v}
        docker build -t $image:$version -t $image:latest --build-arg MCP_VERSION=$version \
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
          --label org.opencontainers.image.version=$version .
        docker push $image:$version
        docker push $image:latest

  # デスクトップアプリの Store 用のパッケージ（.msixupload。署名なし）を作り、Release に載せる（docs/design/desktop-app.md の 9.2）。
  # Store への提出は、このファイルを Partner Center にアップロードして行う（初回の提出は手作業が必要）
  desktop:
    # テスト（release ジョブ）が成功し、Release ができてから載せる
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
    - uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # パッケージの版をタグから X.Y.Z.0 にし、Partner Center でアプリ名を予約したときの ID と発行元を設定する。
    # ID はリポジトリの変数（Settings → Secrets and variables → Actions → Variables）で渡す。未設定なら仮の値のまま
    # （Store には出せないが、ビルドと確認はできる）。手順は docs/design/desktop-app-store.md
    - name: Set package identity
      shell: pwsh
      run: >
        ./.github/scripts/set-msix-identity.ps1 -Manifest src/TTDeployTool.Controller.Desktop/Package.appxmanifest -Tag $env:RELEASE_TAG
        -Name "${{ vars.TT_DESKTOP_IDENTITY_NAME }}" -Publisher "${{ vars.TT_DESKTOP_PUBLISHER }}"
        -PublisherDisplayName "${{ vars.TT_DESKTOP_PUBLISHER_DISPLAY_NAME }}"

    - name: Build MSIX for the Store
      run: >
        msbuild src/TTDeployTool.Controller.Desktop/TTDeployTool.Controller.Desktop.csproj /restore
        /p:Configuration=Release /p:Platform=x64 /p:AppxBundlePlatforms="x64|arm64" /p:AppxBundle=Always
        /p:UapAppxPackageBuildMode=StoreUpload /p:AppxPackageSigningEnabled=false /p:GenerateAppxPackageOnBuild=true
        /p:AppxPackageDir=${{ github.workspace }}\AppPackages\
        /p:DesktopClientId=${{ vars.TT_DESKTOP_CLIENT_ID }}

    - name: Check package manifest
      shell: pwsh
      run: ./.github/scripts/check-msix.ps1 -PackageDir AppPackages -ExpectedVersion "$($env:RELEASE_TAG.TrimStart('v')).0"

    - name: Upload to GitHub Release
      shell: pwsh
      run: |
        $upload = Get-ChildItem AppPackages -Recurse -Filter *.msixupload | Select-Object -First 1
        $name = "ttdeploytool-desktop-$($env:RELEASE_TAG).msixupload"
        Copy-Item $upload.FullName $name
        gh release upload $env:RELEASE_TAG $name
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
