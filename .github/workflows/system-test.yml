name: System Test

# 本物の Azure に対するシステムテスト。所要時間 20〜40 分で料金が発生するため、PR ごとには実行せず、
# リリース前などに手動で実行する。準備（OIDC 用のアプリ登録・変数・シークレット）は docs/SYSTEM_TESTS.md を参照。
on:
  workflow_dispatch:

# 権限不足のシナリオは共有のリソースグループ（rg-ttst-limited）を使うため、同時に 1 つだけ実行する
concurrency:
  group: system-test
  cancel-in-progress: false

permissions:
  id-token: write   # Azure への OIDC ログイン
  contents: read

jobs:
  system-test:
    runs-on: ubuntu-latest
    environment: systemtest
    timeout-minutes: 110

    steps:
    - uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Azure login (OIDC)
      uses: azure/login@v3
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    # セットアップウィザードとログインの確認（TT_E2E_LICENSE_KEY がある場合）に使うブラウザー
    - name: Install Playwright browser
      run: |
        dotnet build tests/TTDeployTool.SystemTests
        pwsh tests/TTDeployTool.SystemTests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

    # ローカルの docker compose での確認（LocalComposeSetupTests）は CI（ci.yml）で行うため、ここでは除く
    - name: System test
      env:
        TT_SYSTEMTEST_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        TT_SYSTEMTEST_LOCATION: ${{ vars.TT_SYSTEMTEST_LOCATION || 'japaneast' }}
        TT_SYSTEMTEST_LIMITED_RESOURCE_GROUP: ${{ vars.TT_SYSTEMTEST_LIMITED_RESOURCE_GROUP || 'rg-ttst-limited' }}
        TT_SYSTEMTEST_LIMITED_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        TT_SYSTEMTEST_LIMITED_CLIENT_ID: ${{ vars.TT_SYSTEMTEST_LIMITED_CLIENT_ID }}
        TT_SYSTEMTEST_LIMITED_CLIENT_SECRET: ${{ secrets.TT_SYSTEMTEST_LIMITED_CLIENT_SECRET }}
        TT_E2E_LICENSE_KEY: ${{ secrets.TT_E2E_LICENSE_KEY }}
        TT_E2E_SAMPLE_LOGIN: ${{ secrets.TT_E2E_SAMPLE_LOGIN }}
        TT_E2E_SAMPLE_PASSWORD: ${{ secrets.TT_E2E_SAMPLE_PASSWORD }}
      run: >
        dotnet test --project tests/TTDeployTool.SystemTests --
        --filter-not-class TTDeployTool.SystemTests.E2E.LocalComposeSetupTests
        --output detailed --report-xunit-trx --results-directory=TestResults

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: system-test-results
        path: TestResults
