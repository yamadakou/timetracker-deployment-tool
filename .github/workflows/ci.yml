name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # 手動で実行したときは、変更したファイルにかかわらず、すべて実行する
  workflow_dispatch:

jobs:
  # 変更したファイルがドキュメント（docs/ の下と *.md）だけかを判定する（.github/scripts/detect-code-changes.ps1）。
  # ドキュメントは、下の 7 つのチェックのどれにも使われていないため、ドキュメントだけなら各チェックを省く（Skipped は成功として扱われる）
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.detect.outputs.code }}

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Detect code changes
      id: detect
      shell: pwsh
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        FORCED: ${{ github.event.forced }}
      run: ./.github/scripts/detect-code-changes.ps1 -EventName $env:EVENT_NAME -Base $env:BASE_SHA -Head $env:HEAD_SHA -Forced $env:FORCED

  # Markdown の中のリンク（ファイルと見出し #...）が切れていないかを確かめる（lychee。設定は lychee.toml）。
  # 外部のサイト（https://...）は相手の都合で失敗することがあるため、ここでは確かめず、.github/workflows/links.yml で月 1 回確かめる。
  # ドキュメントだけの変更でも省かない
  links:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6

    - name: Check internal links
      uses: lycheeverse/lychee-action@v2.9.0
      with:
        lycheeVersion: v0.24.2
        args: --offline --include-fragments --no-progress --config lychee.toml './**/*.md'

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    
    - name: Restore dependencies
      run: dotnet restore TTDeployTool.sln
    
    - name: Build
      run: dotnet build TTDeployTool.sln --configuration Release --no-restore
    
    - name: Test
      run: dotnet test TTDeployTool.sln --configuration Release --no-build --verbosity normal

  # MCP サーバー（HTTP）の配置とロールの割り当てのスクリプト（scripts/*.ps1）を、az を模擬に置き換えて確かめる（Pester）。
  # 管理者が実行する Windows の PowerShell 7 で動かす
  scripts:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6

    - name: Test PowerShell scripts
      shell: pwsh
      run: |
        Install-Module Pester -MinimumVersion 5.5 -Force -Scope CurrentUser -SkipPublisherCheck
        Import-Module Pester -MinimumVersion 5.5
        $config = New-PesterConfiguration
        $config.Run.Path = "tests/scripts"
        $config.Run.Exit = $true
        $config.Output.Verbosity = "Detailed"
        Invoke-Pester -Configuration $config

  # CLI の Dry-run で作った docker-compose.yml でローカルに起動し、セットアップウィザードでサンプルデータベースを作って
  # サンプルデータベースのユーザーでログインできることをブラウザー（Playwright）で確かめる（PostgreSQL / SQL Server）。Linux コンテナを使うため ubuntu で動かす。
  # ライセンスキーとサンプルデータベースのユーザー（リポジトリのシークレット TT_E2E_*）が無い場合（フォークからの PR など）は、テストがスキップされる
  # サンプルデータベースの作成に時間がかかるため、DB 種別ごとにジョブを分けて並行に動かす
  # ドキュメントだけの変更では、ジョブではなく各ステップを省く（マトリックスのジョブをまとめて省くと、
  # 「e2e-local (postgresql)」などの DB 種別ごとの名前でチェックが報告されないため）
  e2e-local:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        db-type: [ postgresql, sqlserver ]
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6
      if: needs.changes.outputs.code == 'true'

    - name: Setup .NET
      if: needs.changes.outputs.code == 'true'
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Install Playwright browser
      if: needs.changes.outputs.code == 'true'
      run: |
        dotnet build tests/TTDeployTool.SystemTests
        pwsh tests/TTDeployTool.SystemTests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

    # すべてスキップされた場合の終了コード 8（テストが 0 件）は失敗にしない
    - name: Setup wizard and login (docker compose)
      if: needs.changes.outputs.code == 'true'
      env:
        TT_E2E_DB_TYPE: ${{ matrix.db-type }}
        TT_E2E_LICENSE_KEY: ${{ secrets.TT_E2E_LICENSE_KEY }}
        TT_E2E_SAMPLE_LOGIN: ${{ secrets.TT_E2E_SAMPLE_LOGIN }}
        TT_E2E_SAMPLE_PASSWORD: ${{ secrets.TT_E2E_SAMPLE_PASSWORD }}
      run: >
        dotnet test --project tests/TTDeployTool.SystemTests --no-build --
        --filter-class TTDeployTool.SystemTests.E2E.LocalComposeSetupTests
        --output detailed --report-xunit-trx --results-directory=TestResults --ignore-exit-code 8

    - name: Upload test results
      if: always() && needs.changes.outputs.code == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: e2e-local-results-${{ matrix.db-type }}
        path: TestResults

  # MCP サーバー（HTTP）のコンテナイメージがビルドでき、起動して /healthz に応答し、トークンなしの /mcp を 401 にすることを確かめる（push はしない）
  docker-mcp:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6

    - name: Build image
      run: docker build -t ttdeploytool-mcp:ci .

    - name: Smoke test
      run: |
        docker run -d --name ttmcp -p 8080:8080 \
          -e TT_MCP_HTTP__TENANT_ID=00000000-0000-0000-0000-000000000001 \
          -e TT_MCP_HTTP__CLIENT_ID=00000000-0000-0000-0000-000000000002 \
          -e TT_MCP_HTTP__PUBLIC_URL=https://mcp.example.com/mcp \
          -e TT_MCP_HTTP__SERVER_ALLOWED_RESOURCE_GROUPS=/subscriptions/00000000-0000-0000-0000-000000000003/resourceGroups/rg \
          ttdeploytool-mcp:ci
        for i in $(seq 1 30); do curl -sf http://localhost:8080/healthz && break; sleep 1; done
        test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/healthz)" = 200
        test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/mcp -H 'Content-Type: application/json' -d '{}')" = 401
        test "$(docker exec ttmcp id -u)" != 0
        docker logs ttmcp

  # デスクトップアプリ（WinUI 3）の Store 用のパッケージ（.msixupload。x64 と arm64 のバンドル。署名なし: Store が認定の後に署名する）を作り、
  # パッケージのマニフェストの版・対象 OS・機能を確かめる（docs/design/desktop/desktop-app.md の 9.1）。
  # Microsoft Learn の WinUI 3 の CI の例に合わせて msbuild を使う。画面の状態と操作のテストは build ジョブ（TTDeployTool.sln）で行う
  desktop:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build MSIX for the Store
      run: >
        msbuild src/TTDeployTool.Controller.Desktop/TTDeployTool.Controller.Desktop.csproj /restore
        /p:Configuration=Release /p:Platform=x64 /p:AppxBundlePlatforms="x64|arm64" /p:AppxBundle=Always
        /p:UapAppxPackageBuildMode=StoreUpload /p:AppxPackageSigningEnabled=false /p:GenerateAppxPackageOnBuild=true
        /p:AppxPackageDir=${{ github.workspace }}\AppPackages\

    - name: Check package manifest
      shell: pwsh
      run: ./.github/scripts/check-msix.ps1 -PackageDir AppPackages -ExpectedVersion 0.1.0.0

    # パッケージは 1 回で約 190MB あり、既定の 90 日では溜まりすぎるため、7 日で消す（Store に出すパッケージは release.yml で Release に載せる）
    - name: Upload package
      uses: actions/upload-artifact@v7
      with:
        name: ttdeploytool-desktop-msixupload
        path: AppPackages/**/*.msixupload
        retention-days: 7

  # デスクトップアプリの UI テスト（docs/design/desktop/desktop-ui-tests.md）。x64 の MSIX を一時的な自己署名の証明書で署名して導入し、
  # UI Automation（FlaUI）で操作する。Azure は使わない。証明書はこのジョブの中だけで使い、保存しない
  desktop-ui:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # 発行者はマニフェストの Publisher（CN=TTDeployTool）と同じにし、コード署名の用途（1.3.6.1.5.5.7.3.3）を付ける。
    # 導入できるよう、公開鍵の証明書だけを「信頼されたユーザー」に入れる
    - name: Create a temporary signing certificate
      id: cert
      shell: pwsh
      run: |
        $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=TTDeployTool" -KeyUsage DigitalSignature `
          -FriendlyName "TTDeployTool UI test" -CertStoreLocation "Cert:\CurrentUser\My" `
          -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
        $cer = Join-Path $env:RUNNER_TEMP "uitest.cer"
        Export-Certificate -Cert $cert -FilePath $cer | Out-Null
        Import-Certificate -FilePath $cer -CertStoreLocation "Cert:\LocalMachine\TrustedPeople" | Out-Null
        "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

    # UI テストのモック（サインインと Azure。docs/design/desktop/desktop-ui-tests.md の 6.2）を使うビルド。この MSIX は UI テストだけに使う
    - name: Build and sign MSIX (x64)
      run: >
        msbuild src/TTDeployTool.Controller.Desktop/TTDeployTool.Controller.Desktop.csproj /restore
        /p:Configuration=Release /p:Platform=x64 /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly /p:UiTestMock=true
        /p:GenerateAppxPackageOnBuild=true /p:AppxPackageSigningEnabled=true
        /p:PackageCertificateThumbprint=${{ steps.cert.outputs.thumbprint }}
        /p:AppxPackageDir=${{ github.workspace }}\UiPackages\

    - name: Install MSIX
      shell: pwsh
      run: |
        $all = Get-ChildItem UiPackages -Recurse -Filter *.msix
        $package = $all | Where-Object { $_.FullName -notmatch '\\Dependencies\\' } | Select-Object -First 1
        $dependencies = @($all | Where-Object { $_.FullName -match '\\Dependencies\\x64\\' } | ForEach-Object FullName)
        Write-Host "Package: $($package.FullName)"
        if ($dependencies.Count -gt 0) {
          Add-AppxPackage -Path $package.FullName -DependencyPath $dependencies
        } else {
          Add-AppxPackage -Path $package.FullName
        }
        Get-AppxPackage -Name TTDeployTool | Format-List Name, PackageFamilyName, Version, SignatureKind

    - name: UI test
      env:
        TT_UITEST_RESULTS_DIRECTORY: ${{ github.workspace }}\TestResults
      run: >
        dotnet test --project tests/TTDeployTool.Controller.Desktop.UITests --
        --output detailed --report-xunit-trx --results-directory=${{ github.workspace }}\TestResults

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: desktop-ui-test-results
        path: TestResults
